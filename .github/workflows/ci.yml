name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skills, plugin and packaging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate shared references and manifests
        run: python3 scripts/validate.py

      - name: Dry-run skill packaging
        run: python3 scripts/package_skills.py --out dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate the marketplace and plugin with Claude Code
        env:
          CLAUDE_CODE_VERSION: "2.1.331"
        run: |
          npx --yes "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate . --strict
          npx --yes "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate plugins/the-human-c-suite --profile directory --strict
