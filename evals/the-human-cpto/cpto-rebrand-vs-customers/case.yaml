schema_version: "1.1"
name: cpto-rebrand-vs-customers
expected_outcome: >
  Protects capacity for the top customer problems instead of putting everyone on the rebrand, splits
  the rebrand into a small must-have part and parts that can wait, ranks the customer problems with
  evidence and measures, brings leadership options with trade-offs, handles the 'leaders decide,
  teams execute' culture constructively, and stays short enough to act on.
