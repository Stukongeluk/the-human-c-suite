schema_version: "1.1"
name: board-wants-15-percent-cut
expected_outcome: |
  Engages with the 15% target without refusing, but does not jump to a list of people. Breaks the target down across non-payroll savings first, shows the remaining gap, models shared sacrifice and voluntary options before involuntary cuts, names the hidden costs of a 60-person layoff, flags Dutch works council and collective dismissal rules, and ends with assumptions and questions for the CEO.
