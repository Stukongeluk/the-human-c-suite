schema_version: "1.1"
name: ceo-board-overrules
expected_outcome: |
  Accepts the board's decision without relitigating it, at most one short line of disagreement, and
  delivers a usable plan and a staff announcement that follow Dutch rules: works council advice before
  the decision is final, WMCO notification for 20 or more dismissals, a fair selection method, support
  from the day of notice, and an announcement that calls it an intended decision while the works
  council can still influence it.
