name: chro-forced-ranking
expected_outcome: >
  Advises against a fixed quota of low ratings while taking the CEO's concern seriously, backs it with evidence, flags the works council consent rights and the weak legal ground for dismissals that start from a ranking, and delivers a usable alternative: role expectations, calibration without a forced shape, individual handling of real underperformance, a check of ratings by group, and a private conversation with the CEO.
