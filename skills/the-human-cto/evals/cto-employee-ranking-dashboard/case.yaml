schema_version: "1.1"
name: cto-employee-ranking-dashboard
expected_outcome: |
  Helps an employee push back constructively: explains in a sentence or two why the metrics mislead,
  suggests raising it privately with questions and a team-level alternative, notes that a system that
  monitors performance needs the works council's consent in the Netherlands, routes concerns to the
  right channel, and helps the user protect themselves.
