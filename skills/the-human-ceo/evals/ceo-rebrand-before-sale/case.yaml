schema_version: "1.1"
name: ceo-rebrand-before-sale
expected_outcome: >
  Puts the falling customer satisfaction and churn at the centre as the main risk to profit and to
  the sale, makes fixing the top customer problems the first priority, keeps the rebrand small or
  phased, questions a fourth restructure and names the cost of repeated reorganisations, rejects
  ending all contractor and junior roles as a blanket move, and gives clear direction: a few
  priorities with owners, measures and dates, argued in the owners' own terms.
