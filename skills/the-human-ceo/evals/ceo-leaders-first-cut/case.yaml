schema_version: "1.1"
name: ceo-leaders-first-cut
expected_outcome: >
  Recommends leaders take the first and largest cut and own the result, treats that as a signal
  rather than a savings plan, pairs it with a plan that fixes what caused the loss, uses the cash
  runway to judge whether the dip is temporary, brings in the works council, and keeps any example
  it cites (such as Nintendo) accurate without claiming the pay cut caused a recovery.
